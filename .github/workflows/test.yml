name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write  # Needed for rocket reaction on /test command

jobs:
  test:
    runs-on: ubuntu-latest
    # Run on PR/push events, or when authorized user comments /test on a PR
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/test') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - name: React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Checkout PR code
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Checkout code
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        id: test
        run: |
          if go test ./...; then
            echo "success" > result.txt
          else
            echo "failure" > result.txt
            exit 1
          fi
        continue-on-error: true

      - name: Save PR number and event type
        if: github.event_name == 'pull_request' || github.event_name == 'issue_comment'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > pr-number.txt
          else
            echo "${{ github.event.issue.number }}" > pr-number.txt
          fi
          echo "${{ github.event_name }}" > event-type.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            result.txt
            pr-number.txt
            event-type.txt
          if-no-files-found: warn
